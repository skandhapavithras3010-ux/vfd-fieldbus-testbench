
name: C++ RTU Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
          python -m pip install pytest

      - name: Compile C++ tests
        run: |
          g++ -std=c++17 -Wall -Wextra \
            -Icpp/include \
            cpp/tests/test_modbus_rtu.cpp \
            cpp/src/modbus_rtu.cpp \
            -o test_modbus_rtu

      - name: Compile CRC CLI
        run: |
          g++ -std=c++17 -Wall -Wextra \
            -Icpp/include \
            cpp/tests/crc_cli.cpp \
            cpp/src/modbus_rtu.cpp \
            -o cpp/tests/crc_cli

      - name: Run C++ tests
        run: ./test_modbus_rtu

      - name: Run Python-C++ CRC differential tests
        run: python -m pytest tests/test_crc_differential.py -v
