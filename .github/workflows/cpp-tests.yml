
name: C++ RTU Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Compile C++ tests
        run: |
          g++ -std=c++17 -Wall -Wextra \
            -Icpp/include \
            cpp/tests/test_modbus_rtu.cpp \
            cpp/src/modbus_rtu.cpp \
            -o test_modbus_rtu

      - name: Run C++ tests
        run: ./test_modbus_rtu
